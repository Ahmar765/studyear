# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
#
# Env vars: set in Firebase Console → App Hosting → Environment variables (recommended),
# or uncomment `env` below. NEXT_PUBLIC_* must be available at BUILD + RUNTIME.
# See docs/DEPLOY.md for the full list.

runConfig:
  maxInstances: 2
  cpu: 1

